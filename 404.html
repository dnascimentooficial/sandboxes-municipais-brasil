<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Sandboxes Brasil</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f6f63">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%232f6f63'/%3E%3Crect x='12' y='12' width='24' height='24' rx='6' fill='none' stroke='%23fff' stroke-width='3' stroke-dasharray='5 4'/%3E%3Ccircle cx='24' cy='24' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
  /* Mesmos tokens de assets/app.css (copiados: esta página não depende de nenhum outro arquivo). */
  :root{--paper:#f4f1ec;--surface:#fffdfa;--ink:#111112;--muted:#6e6962;--line:#e4ded5;--accent:#3f8f80;--accent-deep:#2f6f63;--accent-soft:#eaf4f1;--accent-ring:rgba(63,143,128,.45);--shadow:0 2px 3px rgba(34,27,23,.04),0 18px 45px rgba(52,39,31,.07);--radius:22px;--font:"Helvetica Neue",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:var(--font);font-size:16px;line-height:1.5;color:var(--ink);background:radial-gradient(circle at 92% -8%,rgba(63,143,128,.12),transparent 31rem),var(--paper);-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:560px;padding:40px 32px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
  .eyebrow{margin:0 0 10px;color:var(--accent-deep);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  h1{margin:0 0 12px;font-size:clamp(28px,6vw,40px);line-height:1.1;letter-spacing:-.02em}
  p{margin:0 0 24px;color:var(--muted)}
  a.btn{display:inline-flex;align-items:center;min-height:44px;padding:10px 20px;border-radius:999px;background:var(--accent-deep);color:#fff;font-weight:750;text-decoration:none}
  a.btn:hover{background:var(--accent)}
  :focus-visible{outline:3px solid var(--accent-ring);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Erro 404</p>
  <h1>Página não encontrada</h1>
  <p>O endereço pode ter mudado ou não existe. O observatório de sandboxes regulatórios continua na página inicial.</p>
  <a class="btn" href="/">Voltar para o Sandboxes Brasil</a>
</main>
</body>
</html>
